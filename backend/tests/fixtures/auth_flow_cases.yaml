# Auth state machine test catalog.
# Each entry is one transition: (user_state, endpoint) → expected HTTP status.
#
# auth values:
#   anonymous  — no JWT at all (Authorization header absent)
#   active     — valid JWT, uses credits/tos/tier fields below
#   suspended  — valid JWT, but account is suspended
#
# Adding a new case: append a YAML entry here — no Python changes needed.

# ── /hint (costs 1 credit) ────────────────────────────────────────────────────
- id: anon_hint
  description: "no auth → /hint → 401"
  auth: anonymous
  endpoint: /hint
  expect_status: 401

- id: active_hint
  description: "active user, 20 credits, TOS accepted → /hint → 200"
  auth: active
  credits: 20
  tos: true
  tier: student
  endpoint: /hint
  expect_status: 200

- id: zero_credits_hint
  description: "0 credits → /hint → 402"
  auth: active
  credits: 0
  tos: true
  tier: basic
  endpoint: /hint
  expect_status: 402

- id: tos_not_accepted_hint
  description: "TOS not accepted → /hint → 403 tos_not_accepted"
  auth: active
  credits: 20
  tos: false
  tier: basic
  endpoint: /hint
  expect_status: 403
  expect_error_code: tos_not_accepted

- id: suspended_hint
  description: "suspended account → /hint → 403 account_suspended"
  auth: suspended
  endpoint: /hint
  expect_status: 403
  expect_error_code: account_suspended

- id: boundary_1_credit_hint
  description: "exactly 1 credit → /hint → 200 (boundary: min valid)"
  auth: active
  credits: 1
  tos: true
  tier: student
  endpoint: /hint
  expect_status: 200

# ── /analyze (costs 3 credits) ────────────────────────────────────────────────
- id: anon_analyze
  description: "no auth → /analyze → 401"
  auth: anonymous
  endpoint: /analyze
  expect_status: 401

- id: active_analyze
  description: "active user, 10 credits → /analyze → 200"
  auth: active
  credits: 10
  tos: true
  tier: student
  endpoint: /analyze
  expect_status: 200

- id: zero_credits_analyze
  description: "basic tier, 0 credits → /analyze → 402 (basic tier triggers credit check)"
  auth: active
  credits: 0
  tos: true
  tier: basic
  endpoint: /analyze
  expect_status: 402

- id: tos_not_accepted_analyze
  description: "basic tier, TOS not accepted → /analyze → 403 tos_not_accepted"
  auth: active
  credits: 10
  tos: false
  tier: basic
  endpoint: /analyze
  expect_status: 403
  expect_error_code: tos_not_accepted

- id: suspended_analyze
  description: "suspended account → /analyze → 403"
  auth: suspended
  endpoint: /analyze
  expect_status: 403
  expect_error_code: account_suspended

- id: boundary_2_credits_analyze
  description: "basic tier, 2 credits (< cost=3) → /analyze → 402 (boundary: one below)"
  auth: active
  credits: 2
  tos: true
  tier: basic
  endpoint: /analyze
  expect_status: 402

- id: boundary_3_credits_analyze
  description: "basic tier, exactly 3 credits (= cost) → /analyze → 200 (boundary: min valid)"
  auth: active
  credits: 3
  tos: true
  tier: basic
  endpoint: /analyze
  expect_status: 200

# ── /study-plan (costs 5 credits, requires student+ tier) ────────────────────
- id: anon_study_plan
  description: "no auth → /study-plan → 401"
  auth: anonymous
  endpoint: /study-plan
  expect_status: 401

- id: basic_tier_study_plan
  description: "basic tier → /study-plan → 403 tier_required"
  auth: active
  credits: 100
  tos: true
  tier: basic
  endpoint: /study-plan
  expect_status: 403
  expect_error_code: tier_required

- id: student_tier_study_plan
  description: "student tier, 5 credits → /study-plan → 200"
  auth: active
  credits: 5
  tos: true
  tier: student
  endpoint: /study-plan
  expect_status: 200

- id: complete_tier_study_plan
  description: "complete tier, 5 credits → /study-plan → 200"
  auth: active
  credits: 5
  tos: true
  tier: complete
  endpoint: /study-plan
  expect_status: 200

- id: tos_not_accepted_study_plan
  description: "TOS not accepted → /study-plan → 403"
  auth: active
  credits: 100
  tos: false
  tier: student
  endpoint: /study-plan
  expect_status: 403
  expect_error_code: tos_not_accepted

- id: zero_credits_study_plan
  description: "student tier, 0 credits → /study-plan → 402"
  auth: active
  credits: 0
  tos: true
  tier: student
  endpoint: /study-plan
  expect_status: 402
