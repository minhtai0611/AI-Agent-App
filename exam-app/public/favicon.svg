<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="lg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7CA8F8"/>
      <stop offset="100%" stop-color="#3B6FE8"/>
    </radialGradient>
  </defs>
  <!-- Midnight background -->
  <rect width="32" height="32" rx="5" fill="#080B14"/>
  <!-- Outer dashed orbit ring (cobalt) -->
  <circle cx="16" cy="16" r="13" stroke="#3B6FE8" stroke-width="1"
          stroke-dasharray="2 3" fill="none" opacity="0.75"/>
  <!-- Inner solid ring (violet) -->
  <circle cx="16" cy="16" r="9" stroke="#7C5CE8" stroke-width="0.8"
          fill="none" opacity="0.65"/>
  <!-- Cardinal ticks N/E/S/W -->
  <line x1="16" y1="3"  x2="16" y2="7"  stroke="#5B8FF0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="25" y1="16" x2="29" y2="16" stroke="#5B8FF0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="16" y1="25" x2="16" y2="29" stroke="#5B8FF0" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="3"  y1="16" x2="7"  y2="16" stroke="#5B8FF0" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Diagonal intercardinal ticks NE/SE/SW/NW -->
  <line x1="22.4" y1="9.6"  x2="25.2" y2="6.8"  stroke="#5B8FF0" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <line x1="22.4" y1="22.4" x2="25.2" y2="25.2" stroke="#5B8FF0" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <line x1="9.6"  y1="22.4" x2="6.8"  y2="25.2" stroke="#5B8FF0" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <line x1="9.6"  y1="9.6"  x2="6.8"  y2="6.8"  stroke="#5B8FF0" stroke-width="0.9" stroke-linecap="round" opacity="0.6"/>
  <!-- Center luminous point -->
  <circle cx="16" cy="16" r="3"   fill="url(#lg)"/>
  <circle cx="16" cy="16" r="1.5" fill="#A8C5FF" opacity="0.9"/>
</svg>
